---
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  # --- Changelog categories (rendered into $CHANGES) ---
  - title: '🚀 Features'
    when:
      labels:
        - 'enhancement'
        - 'mechanics'
  - title: '🌐 Web Enhancements'
    when:
      label: 'web'
  - title: '🐛 Bug Fixes'
    when:
      label: 'bug'
  - title: '🧰 Maintenance'
    when:
      labels:
        - 'setup'
        - 'tools'
        - 'CI/CD'
  - title: '📄 Documentation'
    when:
      label: 'documentation'

  # --- Version resolution only (not rendered in the changelog) ---
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      label: 'major'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      label: 'minor'
  - type: 'version-resolver'
    semver-increment: 'patch'
    when:
      label: 'patch'
commitish: main  # Add this to fix the target_commitish error
change-template: '* $TITLE (#$NUMBER) @$AUTHOR'
no-changes-template: '* No changes'
version-resolver:
  default: patch
template: |
  ## Changes
  $CHANGES

---
name: "Browser Functional Tests"

on:  # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: "Codecov requires a token to authenticate"
        required: true
    inputs:
      godot_version:
        type: "string"
        default: "4.7.1-stable"
      pw_timeout:
        description: "Playwright timeout in ms"
        required: false
        type: "number"
        default: 30000

jobs:
  build-web:
    name: "Build Web Artifact"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false

      - name: "Disable Editor Plugins (Prevent Headless Crash)"
        run: |
          source .github/scripts/ci_utils.sh
          disable_editor_plugins "project.godot"

      - name: "Inject Test Salt into GDScript"
        env:
          PRODUCTION_SALT: "playwright_dummy_salt_123"
        run: |
          bash ./.github/scripts/inject_salt.sh "scripts/core/globals.gd"

      - name: "Inject 'ci' feature flag into export_presets.cfg"
        run: |
          python3 .github/scripts/inject_ci_flag.py

      - name: "Create Export Directories"
        run: |
          mkdir -p export/web_thread_off

      # yamllint disable rule:line-length
      - name: "Export Godot to Web"
        id: "export"
        uses: "firebelley/godot-export@615a6f7afc22d6266bf55c17748fb07447e8bdab"  # v8.0.0
        with:
          godot_executable_download_url: "https://github.com/godotengine/godot/releases/download/${{ inputs.godot_version }}/Godot_v${{ inputs.godot_version }}_linux.x86_64.zip"
          godot_export_templates_download_url: "https://github.com/godotengine/godot/releases/download/${{ inputs.godot_version }}/Godot_v${{ inputs.godot_version }}_export_templates.tpz"
          relative_project_path: "./"
          relative_export_path: "./export/web_thread_off"
          archive_output: false
          cache: false
          verbose: true
          presets_to_export: "Web_thread_off"
          use_preset_export_path: true

      - name: "Flatten Export Directory"
        run: |
          bash ./.github/scripts/flatten_export.sh "export/web_thread_off" "Web_thread_off"
      # yamllint enable rule:line-length

      - name: "Patch index.js for security"
        run: |
          bash ./.github/scripts/patch_index_js.sh "export/web_thread_off"

      - name: "Generate Build Integrity Manifest"
        run: |
          cat <<EOF > export/web_thread_off/build_manifest.json
          {
            "commit_sha": "${{ github.sha }}",
            "godot_version": "${{ inputs.godot_version }}"
          }
          EOF

      - name: "Upload Web Build Artifact"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # v7.0.1
        with:
          name: "godot-web-build"
          path: "export/web_thread_off"
          retention-days: 1

  test-shard:
    name: "Shard: ${{ matrix.suite }}"
    needs: "build-web"
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: "Core Web Flows"
            test_path: "tests/*_test.py"
            artifact_suffix: "core"
          - suite: "Refactor Suite"
            test_path: "tests/refactor/*.py"
            artifact_suffix: "refactor"
            allow_empty: "true"
          - suite: "CI & Security"
            test_path: "tests/ci/*.py"
            artifact_suffix: "ci"

    env:
      PW_TIMEOUT: "${{ inputs.pw_timeout }}"

    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false

      - name: "Download Web Build Artifact"
        # yamllint disable-line rule:line-length
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"  # v8.0.1
        with:
          name: "godot-web-build"
          path: "export/web_thread_off"

      - name: "Validate Artifact Integrity"
        run: |
          MANIFEST="export/web_thread_off/build_manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "❌ CRITICAL: Build manifest missing from exported web artifact!"
            exit 1
          fi
          DOWNLOADED_SHA=$(python3 -c \
            "import json; print(json.load(open('$MANIFEST')).get('commit_sha', ''))")
          EXPECTED_SHA="${{ github.sha }}"
          if [ "$DOWNLOADED_SHA" != "$EXPECTED_SHA" ]; then
            echo "❌ CRITICAL: Commit SHA mismatch in web build artifact!"
            echo "Expected: $EXPECTED_SHA | Received: $DOWNLOADED_SHA"
            exit 1
          fi
          echo "✅ Artifact integrity verified successfully for commit $DOWNLOADED_SHA."

      - name: "Set up Python"
        uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97"  # v7.0.0
        with:
          python-version: "3.12"

      - name: "Cache PIP Dependencies"
        uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9"  # v6.1.0
        id: "cache"
        with:
          path: "~/.cache/pip"
          key: "${{ runner.os }}-pip-v2-${{ hashFiles('requirements.txt') }}"
          restore-keys: "${{ runner.os }}-pip-v2-"

      - name: "Install System Dependencies"
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: "noninteractive"
        run: |
          APT_OPTS=(-o Acquire::Retries=3)
          sudo apt-get "${APT_OPTS[@]}" update
          sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends libxml2-utils

      - name: "Install Python Dependencies"
        timeout-minutes: 8
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt \
            --progress-bar off \
            --timeout 60 \
            --retries 3

      # yamllint disable rule:line-length
      - name: "Get Playwright Version"
        id: "playwright-version"
        run: |
          echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> $GITHUB_OUTPUT
      # yamllint enable rule:line-length

      - name: "Cache Playwright Browsers"
        uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9"  # v6.1.0
        id: "playwright-cache"
        with:
          path: "~/.cache/ms-playwright"
          # yamllint disable-line rule:line-length
          key: "${{ runner.os }}-playwright-v2-${{ steps.playwright-version.outputs.version }}"

      - name: "Install Playwright Browsers"
        if: "steps.playwright-cache.outputs.cache-hit != 'true'"
        timeout-minutes: 8
        run: |
          playwright install --with-deps chromium

      # Only launches the server; readiness is checked by the next step (#1004)
      - name: "Start Security-Isolated HTTP Server"
        run: |
          python3 .github/scripts/serve_web_export.py 8080 "export/web_thread_off" &

      - name: "Wait For WEB Server Response"
        run: |
          ready=false
          for i in {1..20}; do
            if curl -f http://localhost:8080/index.html >/dev/null 2>&1; then
              echo "Server ready (attempt $i)"
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "❌ Web server did not respond after 20 attempts." >&2
            exit 1
          fi
          curl -I http://localhost:8080/index.html

      - name: "Create Artifacts Directory"
        run: |
          mkdir -p artifacts
          rm -f artifacts/trace_*.zip artifacts/failure_*.png \
            artifacts/video_*.webm 2>/dev/null || true

      - name: "Run Sharded Tests"
        run: |
          shopt -s nullglob
          files=(${{ matrix.test_path }})
          export PYTEST_TIMEOUT=$((${{ inputs.pw_timeout }} / 1000))
          if [ ${#files[@]} -gt 0 ]; then
            PYTHONPATH="$PWD/tests:$PYTHONPATH" pytest "${files[@]}" \
              -v \
              -s \
              --capture=no \
              --timeout-method=thread \
              --junitxml=artifacts/junit.xml -o junit_family=legacy
          else
            echo "⚠️ No test files matched pattern: ${{ matrix.test_path }}."
            cat <<EOF > artifacts/junit.xml
          <?xml version="1.0" encoding="utf-8"?>
          <testsuites>
            <testsuite name="empty" tests="0" failures="0" errors="0" skipped="0"/>
          </testsuites>
          EOF
            if [ "${{ matrix.allow_empty }}" != "true" ]; then
              echo "❌ Required suite failed: no test files matched pattern." >&2
              exit 1
            fi
          fi

      - name: "Preserve Baseline Profiling Metrics (#776)"
        if: "always()"
        run: |
          src="artifacts/metrics_baseline.json"
          dst="artifacts/metrics_baseline_${{ matrix.artifact_suffix }}.json"
          if [ -f "$src" ]; then
            cp "$src" "$dst"
            echo "📊 Baseline metrics preserved to $dst"
          fi

      - name: "List Coverage Reports"
        if: "!cancelled()"
        run: |
          ls -la artifacts/v8_coverage_*.json || \
            ls -la v8_coverage_*.json || \
            echo "No coverage files found"

      - name: "Set up Node.js for Coverage Conversion"
        if: "!cancelled()"
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"  # v7.0.0
        with:
          node-version: "24"

      - name: "Install Conversion Tools"
        if: "!cancelled()"
        timeout-minutes: 5
        run: |
          npm install v8-to-istanbul nyc

      # yamllint disable rule:line-length
      - name: "Convert V8 to LCOV"
        if: "!cancelled()"
        run: |
          mkdir -p .nyc_output coverage/lcov
          for file in artifacts/v8_coverage_*.json; do
            [ -e "$file" ] || continue
            node -e "
            const fs = require('fs');
            const path = require('path');
            const V8ToIstanbul = require('v8-to-istanbul');
            const rawCoverage = JSON.parse(fs.readFileSync('$file', 'utf8'));
            const coverage = rawCoverage.result ? rawCoverage.result : rawCoverage;
            const fileSlug = path.basename('$file', '.json').replace(/^v8_coverage_/, '');
            (async () => {
              let localCounter = 0;
              for (const entry of coverage) {
                if (!entry.functions || entry.functions.length === 0) continue;
                const scriptPath = entry.url && entry.url.startsWith('http://localhost:8080/')
                  ? entry.url.replace('http://localhost:8080/', path.join(process.cwd(), 'export/web_thread_off/'))
                  : 'export/web_thread_off/index.js';
                const options = entry.source ? { source: entry.source } : {};
                try {
                  const converter = new V8ToIstanbul(scriptPath, 0, options);
                  if (entry.url) await converter.load();
                  converter.applyCoverage(entry.functions);
                  const filename = path.basename(scriptPath) + '_' + fileSlug + '_' + (localCounter++) + '.json';
                  fs.writeFileSync(path.join('.nyc_output', filename), JSON.stringify(converter.toIstanbul()));
                } catch (e) {
                  console.error('Skipping entry: ' + e.message);
                }
              }
            })();
            "
          done
          npx nyc report --reporter=lcov --report-dir coverage/lcov --all --include=export/web_thread_off/*.js
      # yamllint enable rule:line-length

      - name: "Upload LCOV Artifact"
        if: "always()"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # v7.0.1
        with:
          name: "lcov-report-${{ matrix.artifact_suffix }}"
          path: "./coverage/lcov/lcov.info"
          retention-days: 5

      - name: "Test Report"
        if: "always()"
        run: |
          JUNIT_FILE="artifacts/junit.xml"
          if [ ! -f "$JUNIT_FILE" ]; then JUNIT_FILE="junit.xml"; fi
          if [ -f "$JUNIT_FILE" ]; then
            total=$(xmllint --xpath 'count(//testcase)' "$JUNIT_FILE")
            failures=$(xmllint --xpath 'count(//testcase/failure)' "$JUNIT_FILE")
            errors=$(xmllint --xpath 'count(//testcase/error)' "$JUNIT_FILE")
            skipped=$(xmllint --xpath 'count(//testcase/skipped)' "$JUNIT_FILE")
            passed=$((total - failures - errors - skipped))
            echo "Test Report Summary (${{ matrix.suite }}):"
            echo "- Total tests: $total"
            echo "- Passed: $passed"
            echo "- Failed: $failures"
            echo "- Errors: $errors"
            echo "- Skipped: $skipped"
          else
            echo "No junit.xml found—tests may not have run."
          fi

      - name: "Upload Test Report Artifact"
        if: "always()"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # v7.0.1
        with:
          name: "test-report-${{ matrix.artifact_suffix }}"
          path: |
            artifacts/junit.xml
            junit.xml
          if-no-files-found: "ignore"

      - name: "Upload Profiling Baseline Artifact (#776)"
        if: "always()"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # v7.0.1
        with:
          name: "metrics-baseline-${{ matrix.artifact_suffix }}"
          path: |
            artifacts/metrics_baseline.json
            artifacts/metrics_baseline_${{ matrix.artifact_suffix }}.json
          if-no-files-found: "ignore"
          retention-days: 14

      - name: "Upload Failure Diagnostic Artifacts"
        if: "failure()"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # v7.0.1
        with:
          name: "test-failures-${{ matrix.artifact_suffix }}"
          path: |
            artifacts/trace_*.zip
            artifacts/failure_*.png
            artifacts/video_*.webm
          if-no-files-found: "ignore"
          retention-days: 7

      - name: "Upload Coverage to Codecov"
        if: "${{ !cancelled() }}"
        uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5"  # v7.1.1
        with:
          files: "./coverage/lcov/lcov.info"
          flags: "playwright-${{ matrix.artifact_suffix }}"
          fail_ci_if_error: false
          verbose: true
          token: "${{ secrets.CODECOV_TOKEN }}"
          directory: "export/web_thread_off"

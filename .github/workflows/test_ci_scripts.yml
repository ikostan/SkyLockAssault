---
name: "CI/CD Infrastructure Tests"

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      runner:
        description: "Runner label. Ubuntu 26.04 canary passes ubuntu-26.04"
        type: "string"
        default: "ubuntu-24.04"
      godot_version:
        description: "The Godot version string passed from the calling pipeline"
        type: "string"
        required: true

jobs:
  test-python:
    name: "Run CI Injection Tests"
    runs-on: "${{ inputs.runner }}"
    timeout-minutes: 5
    steps:

      - name: "Checkout code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0"  # v7.1.0
        with:
          python-version: "3.12"

      - name: "Install Dependencies"
        timeout-minutes: 4
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright pyyaml pytest-timeout
          # update_gdscript_docs.py exits at import without these (#1055)
          pip install -r .github/scripts/requirements-docs.txt
          playwright install chromium

      - name: "Run CI Injection Tests"
        run: |
          pytest tests/ci/ -v -s

  verify-godot:
    name: "Test Godot Asset Infrastructure and Signature Verification"
    runs-on: "${{ inputs.runner }}"
    timeout-minutes: 10  # Generous timeout to download the 1.2 GB template file
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false

      - name: "Test Godot Asset Infrastructure and Signature Verification"
        run: |
          chmod +x .github/scripts/verify_godot.sh
          bash .github/scripts/verify_godot.sh "${{ inputs.godot_version }}"

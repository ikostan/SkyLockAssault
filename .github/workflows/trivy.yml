---
name: "Trivy vulnerability scanner"

on:  # yamllint disable-line rule:truthy
  # Makes it reusable; called by other workflows
  workflow_call:  # yamllint disable rule:empty-values

jobs:
  security-scan:
    runs-on: "ubuntu-latest"
    permissions:  # Least-privilege permissions for Trivy
      contents: "read"  # For checkout
      security-events: "write"  # For uploading SARIF to Security tab
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        with:
          # This explicitly tells the runner to use the branch that triggered the workflow
          ref: "${{ github.ref_name }}"
          fetch-depth: 0
          persist-credentials: false
      - name: "Run Trivy FS Scan"
        # Pin Trivy action to a specific commit to avoid supply-chain risk
        uses: "aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25"
        env:  # Suppress version check notification
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          version: "v0.69.2"
          scan-type: "fs"  # Scans the filesystem (your repo after checkout)
          scanners: "vuln,secret,misconfig,license"  # Vulns, secrets, configs, licenses
          hide-progress: false
          format: "sarif"  # SARIF output for GitHub Security tab
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"  # Focus on serious issues
          exit-code: "1"  # Fail workflow if critical/high vulns found
          ignore-unfixed: true  # Ignore vulns without fixes available

      - name: "Upload Trivy scan results to GitHub Security tab"
        # Pinned to CodeQL upload-sarif v3 for security stability; refresh periodically
        uses: "github/codeql-action/upload-sarif@d97b3428e8eebbb1810cf454d6397886d136b4ba"
        if: "always()"  # Upload even if scan fails
        with:
          sarif_file: "trivy-results.sarif"

---
name: "GUT Unit Tests"

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      godot_version:
        type: "string"
        default: "4.7.1-stable"
      godot_sha256:
        type: "string"
        default: ""
    secrets:
      CODECOV_TOKEN:
        description: "Codecov requires a token to authenticate"
        required: true

jobs:
  unit-test:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      checks: "write"
    env:
      GODOT_VERSION: "${{ inputs.godot_version }}"
      GODOT_SHA256: "${{ inputs.godot_sha256 }}"
    steps:
      - uses: "actions/checkout@v7"
        with:
          persist-credentials: false

      - name: "Download and Verify Godot Binary"
        run: |
          URL="https://github.com/godotengine/godot/releases/download"
          ZIP_NAME="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          wget -q "${URL}/${GODOT_VERSION}/${ZIP_NAME}"

          if [ -n "${GODOT_SHA256}" ]; then
            echo "${GODOT_SHA256}  ${ZIP_NAME}" | sha256sum --check --status || {
              echo "❌ CRITICAL: Godot binary verification failed! Checksum mismatch."
              exit 1
            }
          fi

          unzip "${ZIP_NAME}"
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

      - name: "Install GUT"
        run: |
          mkdir -p addons
          URL="https://github.com/bitwes/Gut/archive/refs/tags/v9.7.1.zip"
          wget "$URL"
          unzip v9.7.1.zip -d addons
          mv addons/Gut-9.7.1/addons/gut addons/gut
          rm -rf addons/Gut-9.7.1 v9.7.1.zip

      - name: "Clean Cache"
        run: |
          rm -rf .godot/

      - name: "Initialize Project and UIDs"
        run: |
          timeout 30s ./godot --headless --audio-driver Dummy --editor --path . || true

      - name: "Run GUT Tests"
        continue-on-error: false  # Explicit no continue on error
        run: |
          REPORT_DIR="gut-reports/$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$REPORT_DIR"
          ./godot --headless --verbose --path . \
            -s addons/gut/gut_cmdln.gd \
            -gconfig=res://.gutconfig.json \
            -gjunit_xml_file="$REPORT_DIR/gut_junit.xml" \
            -gexit

      - name: "Find Latest Report Directory"
        if: "always()"
        id: "find_report"
        run: |
          LATEST_REPORT=$(ls -td gut-reports/* | head -1 || echo "")
          if [ -z "$LATEST_REPORT" ]; then
            echo "No report directory found; tests may not have generated reports."
            exit 1
          fi
          echo "latest_report=$LATEST_REPORT" >> "$GITHUB_OUTPUT"

      - name: "List Reports"
        if: "always()"
        env:
          REPORT_DIR: "${{ steps.find_report.outputs.latest_report }}"
        run: |
          if [ -n "$REPORT_DIR" ] && [ -d "$REPORT_DIR" ]; then
            ls -la "$REPORT_DIR/"
          else
            echo "No valid report directory to list."
          fi

      - name: "Upload Test Reports Artifacts"
        if: "always()"
        uses: "actions/upload-artifact@v7"
        with:
          name: "gut-reports"
          path: "gut-reports/**"
          retention-days: 5

---
name: "Pull Request Pipeline"

# Cancel stale runs on rapid successive pushes to the same PR, saving CI minutes
concurrency:
  group: "pr-pipeline-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

# Least-privilege floor for the orchestrator. Verified against all 7 called workflows on
# 2026-09-27: none use the SARIF/security-events API. Only gdunit4_tests and gut_tests
# request checks:write, granted at the job level below rather than here.
permissions:
  contents: "read"
  pull-requests: "read"

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - "main"  # yamllint disable-line rule:quoted-strings

jobs:
  detect-changes:
    name: "Detect Changed Files"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
    outputs:
      gdscript: "${{ steps.filter.outputs.gdscript }}"
      python_tests: "${{ steps.filter.outputs.python_tests }}"
      markdown: "${{ steps.filter.outputs.markdown }}"
      yaml: "${{ steps.filter.outputs.yaml }}"
      ci: "${{ steps.filter.outputs.ci }}"
    steps:
      - name: "Checkout Code"
        uses: "actions/checkout@v7.0.1"
        with:
          # Full history: on a batched push (multiple commits at once, rebase, force-push)
          # github.event.before may point further back than a shallow clone can see,
          # which breaks the paths-filter diff below. fetch-depth: 0 removes that risk
          # entirely at the cost of a slower checkout on this one job.
          fetch-depth: 0
      - name: "Filter Paths"
        uses: "dorny/paths-filter@v3"
        id: "filter"
        with:
          token: ""
          # On subsequent pushes, compare against the last commit. On initial PR open, fall back to the base branch.
          base: "${{ github.event.before == '0000000000000000000000000000000000000000' && github.event.pull_request.base.sha || github.event.before }}"
          filters: |
            gdscript:
              - '**/*.gd'
              - 'project.godot'
              - 'test/**'           # Corrected to capture Godot tests (GUT/GDUnit4)
            python_tests:
              - 'tests/**/*.py'     # Explicitly captures Playwright/E2E tests
              - 'pytest.ini'
            markdown:
              - '**/*.md'
              - '**/*.txt'          # Grouped text files with documentation
            yaml:
              - '**/*.yml'
              - '**/*.yaml'
            ci:
              - '.github/**'
              - 'tests/ci/**'
              - 'workspace/**/*.sh' # Added bash workspace scripts
              - 'workspace/**/*.py' # Added workspace python scripts
              - 'infra/**'          # Added docker and nginx configuration

  # NOTE: jobs below call a reusable workflow via `uses:`. That job shape does not support
  # `runs-on` or `timeout-minutes` — GitHub Actions only allows needs/if/permissions/uses/
  # with/secrets/strategy/name on a call job. Each called workflow sets its own timeout
  # internally instead (see gdlint.yml, gut_tests.yml, etc.).

  gdlint:
    name: "GDScript Lint and Format Check"
    needs: "detect-changes"
    permissions:
      contents: "read"
    if: "${{ needs.detect-changes.outputs.gdscript == 'true' }}"
    uses: "./.github/workflows/gdlint.yml"

  readmelint:
    name: "Markdown Lint"
    needs: "detect-changes"
    permissions:
      contents: "read"
    if: "${{ needs.detect-changes.outputs.markdown == 'true' }}"
    uses: "./.github/workflows/lint_readme.yml"

  yamllint:
    name: "YAML Lint"
    needs: "detect-changes"
    permissions:
      contents: "read"
    if: "${{ needs.detect-changes.outputs.yaml == 'true' }}"
    uses: "./.github/workflows/yamllint.yml"
    with:
      config-path: ".github/workflows/*.yml"

  gdunit4_tests:
    name: "GDUnit4 Unit Tests"
    needs:
      - "detect-changes"
      - "gdlint"
      - "readmelint"
      - "yamllint"
    permissions:
      contents: "read"
      checks: "write"  # Required: gdunit4_tests.yml's own job declares checks:write
    # always() lets this job evaluate even if a needed job was skipped (e.g. no markdown
    # changed). The explicit result checks below are what actually block it on failure,
    # since a lint failure makes its own downstream test job *skip* rather than fail.
    # yamllint disable rule:line-length
    if: >-
      ${{
        always() &&
        needs.detect-changes.outputs.gdscript == 'true' &&
        needs.gdlint.result != 'failure' &&
        needs.readmelint.result != 'failure' &&
        needs.yamllint.result != 'failure'
      }}
    # yamllint enable rule:line-length
    uses: "./.github/workflows/gdunit4_tests.yml"
    secrets:
      CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"

  gut_tests:
    name: "GUT Unit Tests"
    needs:
      - "detect-changes"
      - "gdlint"
      - "readmelint"
      - "yamllint"
    permissions:
      contents: "read"
      checks: "write"  # Required: gut_tests.yml's own job declares checks:write
    # yamllint disable rule:line-length
    if: >-
      ${{
        always() &&
        needs.detect-changes.outputs.gdscript == 'true' &&
        needs.gdlint.result != 'failure' &&
        needs.readmelint.result != 'failure' &&
        needs.yamllint.result != 'failure'
      }}
    # yamllint enable rule:line-length
    uses: "./.github/workflows/gut_tests.yml"
    secrets:
      CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"

  ci_script_tests:
    name: "CI/CD Infrastructure Tests"
    needs:
      - "detect-changes"
      - "gdlint"
      - "readmelint"
      - "yamllint"
    permissions:
      contents: "read"
    # yamllint disable rule:line-length
    if: >-
      ${{
        always() &&
        needs.detect-changes.outputs.ci == 'true' &&
        needs.gdlint.result != 'failure' &&
        needs.readmelint.result != 'failure' &&
        needs.yamllint.result != 'failure'
      }}
    # yamllint enable rule:line-length
    uses: "./.github/workflows/test_ci_scripts.yml"
    with:
      godot_version: "4.7.1-stable"

  browser_tests:
    name: "Browser Functional Tests"
    needs:
      - "detect-changes"
      - "gdlint"
      - "readmelint"
      - "yamllint"
      - "gdunit4_tests"
      - "gut_tests"
      - "ci_script_tests"
    permissions:
      contents: "read"
    # Gated on the lint jobs directly, not just on the unit-test jobs. A lint failure
    # causes gdunit4_tests/gut_tests to be *skipped*, not failed. A skipped result still
    # passes a "!= failure" check. So without these direct checks, a lint failure would
    # be silently absorbed and browser tests would still run.
    # yamllint disable rule:line-length
    if: >-
      ${{
        always() &&
        (
          needs.detect-changes.outputs.gdscript == 'true' ||
          needs.detect-changes.outputs.python_tests == 'true'
        ) &&
        needs.gdlint.result != 'failure' &&
        needs.readmelint.result != 'failure' &&
        needs.yamllint.result != 'failure' &&
        needs.gdunit4_tests.result != 'failure' &&
        needs.gut_tests.result != 'failure' &&
        needs.ci_script_tests.result != 'failure'
      }}
    # yamllint enable rule:line-length
    uses: "./.github/workflows/browser_test.yml"
    secrets:
      CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"

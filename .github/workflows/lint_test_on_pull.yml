---
name: "Pull Request Pipeline"

permissions:
  contents: "write"
  pull-requests: "write"
  actions: "read"
  security-events: "write"
  checks: "write"

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - "main"

jobs:
  detect-changes:
    name: "Detect Changed Files"
    runs-on: "ubuntu-latest"
    outputs:
      gdscript: "${{ steps.filter.outputs.gdscript }}"
      python_tests: "${{ steps.filter.outputs.python_tests }}"
      markdown: "${{ steps.filter.outputs.markdown }}"
      yaml: "${{ steps.filter.outputs.yaml }}"
      ci: "${{ steps.filter.outputs.ci }}"
    steps:
      - name: "Checkout Code"
        uses: "actions/checkout@v7.0.1"
      - name: "Filter Paths"
        uses: "dorny/paths-filter@v3"
        id: "filter"
        with:
          filters: |
            gdscript:
              - '**/*.gd'
              - 'project.godot'
              - 'test/**'           # Corrected to capture Godot tests (GUT/GDUnit4)
            python_tests:
              - 'tests/**/*.py'     # Explicitly captures Playwright/E2E tests
              - 'pytest.ini'
            markdown:
              - '**/*.md'
              - '**/*.txt'          # Grouped text files with documentation
            yaml:
              - '**/*.yml'
              - '**/*.yaml'
            ci:
              - '.github/**'
              - 'tests/ci/**'
              - 'workspace/**/*.sh' # Added bash workspace scripts
              - 'workspace/**/*.py' # Added workspace python scripts
              - 'infra/**'          # Added docker and nginx configuration

  gdlint:
    name: "GDScript Lint and Format Check"
    needs: "detect-changes"
    if: "${{ needs.detect-changes.outputs.gdscript == 'true' }}"
    uses: "./.github/workflows/gdlint.yml"

  readmelint:
    name: "Markdown Lint"
    needs: "detect-changes"
    if: "${{ needs.detect-changes.outputs.markdown == 'true' }}"
    uses: "./.github/workflows/lint_readme.yml"

  yamllint:
    name: "YAML Lint"
    needs: "detect-changes"
    if: "${{ needs.detect-changes.outputs.yaml == 'true' }}"
    uses: "./.github/workflows/yamllint.yml"
    with:
      config-path: ".github/workflows/*.yml"

  gdunit4_tests:
    name: "GDUnit4 Unit Tests"
    needs:
      - "detect-changes"
      - "gdlint"
      - "readmelint"
      - "yamllint"
    # yamllint disable rule:line-length
    if: "${{ always() && needs.detect-changes.outputs.gdscript == 'true' && needs.gdlint.result != 'failure' }}"
    # yamllint enable rule:line-length
    uses: "./.github/workflows/gdunit4_tests.yml"
    secrets:
      CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"

  gut_tests:
    name: "GUT Unit Tests"
    needs:
      - "detect-changes"
      - "gdlint"
      - "readmelint"
      - "yamllint"
    # yamllint disable rule:line-length
    if: "${{ always() && needs.detect-changes.outputs.gdscript == 'true' && needs.gdlint.result != 'failure' }}"
    # yamllint enable rule:line-length
    uses: "./.github/workflows/gut_tests.yml"
    secrets:
      CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"

  ci_script_tests:
    name: "CI/CD Infrastructure Tests"
    needs:
      - "detect-changes"
      - "gdlint"
      - "readmelint"
      - "yamllint"
    if: "${{ always() && needs.detect-changes.outputs.ci == 'true' }}"
    uses: "./.github/workflows/test_ci_scripts.yml"
    with:
      godot_version: "4.7.1-stable"

  browser_tests:
    name: "Browser Functional Tests"
    needs:
      - "detect-changes"
      - "gdunit4_tests"
      - "gut_tests"
      - "ci_script_tests"
    if: "${{ always() && needs.detect-changes.outputs.gdscript == 'true' }}"
    uses: "./.github/workflows/browser_test.yml"
    secrets:
      CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"

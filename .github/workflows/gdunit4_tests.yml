---
name: "GDUnit4 Unit Tests"

# Ref #889, #887: Standardizes Godot 4.7.1-stable runtime and gdUnit4 v6.2.0.
# gdUnit4-coverage was removed: its trial build is capped at 20 files and the
# maintainer considers micro-batching around that cap a circumvention of the trial
# restriction. This workflow runs every gdUnit4 suite in a single pass with no
# coverage collection.
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      godot_version:
        type: "string"
        default: "4.7.1-stable"
      godot_sha256:
        type: "string"
        default: "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba"

jobs:
  unit-test:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    # Least privilege (#1003): no step uses the Checks API; checkout only reads.
    permissions:
      contents: "read"
    env:
      GODOT_VERSION: "${{ inputs.godot_version }}"
      GODOT_SHA256: "${{ inputs.godot_sha256 }}"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false

      - name: "Install System Dependencies (xvfb)"
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: "noninteractive"
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            echo "✅ xvfb-run already on runner image; skipping apt."
            exit 0
          fi
          # Skip the flaky Azure mirror if an alternative exists in the list
          MIRRORS="/etc/apt/apt-mirrors.txt"
          if [ -f "$MIRRORS" ] && grep -qv 'azure\.archive' "$MIRRORS"; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$MIRRORS"
          fi
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends xvfb

      # Download official Godot Linux binary and enforce SHA-256 integrity validation
      - name: "Download and Verify Godot Binary"
        run: |
          URL="https://github.com/godotengine/godot/releases/download"
          ZIP_NAME="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          wget -q --tries=3 --timeout=30 "${URL}/${GODOT_VERSION}/${ZIP_NAME}"

          echo "=================================================="
          echo "         ASSET SHA256 CHECKSUM                    "
          echo "=================================================="
          CALCULATED_SHA256=$(sha256sum "${ZIP_NAME}" | awk '{print $1}')
          echo "SHA256 for ${ZIP_NAME}:"
          echo "${CALCULATED_SHA256}"
          echo "=================================================="

          # Verify downloaded asset checksum against expected hash if provided
          if [ -n "${GODOT_SHA256}" ]; then
            echo "${GODOT_SHA256}  ${ZIP_NAME}" | sha256sum --check --status || {
              echo "❌ CRITICAL: Godot binary verification failed! Checksum mismatch."
              exit 1
            }
          fi

          unzip "${ZIP_NAME}"
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

      # Validate that the binary matches the expected version string
      # (converts -stable to .stable)
      - name: "Verify Godot Engine Version Parity"
        run: |
          ENGINE_VERSION=$(./godot --version)
          echo "Detected engine version: $ENGINE_VERSION"
          EXPECTED_VERSION="${GODOT_VERSION/-stable/.stable}"
          echo "$ENGINE_VERSION" | grep -q "$EXPECTED_VERSION" || {
            echo "❌ ERROR: Expected Godot ${EXPECTED_VERSION},"
            echo "   but received: $ENGINE_VERSION"
            exit 1
          }
          echo "✅ Version parity verified (${EXPECTED_VERSION})."

      # Install GDUnit4 Core addon and disable strict GDScript warnings
      # to avoid test aborts
      - name: "Install GDUnit4 Core"
        run: |
          rm -rf addons/gdUnit4 addons/gdunit4_coverage override.cfg
          mkdir -p addons

          # 1. Download and extract GDUnit4 Core framework (v6.2.0)
          URL_GDUNIT="https://github.com/godot-gdunit-labs/gdUnit4/archive/refs/tags/v6.2.0.zip"
          wget -q --tries=3 --timeout=30 "$URL_GDUNIT" -O gdunit4.zip
          unzip -q gdunit4.zip -d addons
          mv addons/gdUnit4-6.2.0/addons/gdUnit4 addons/gdUnit4
          rm -rf addons/gdUnit4-6.2.0 gdunit4.zip

          # 2. Disable strict warnings so warnings-as-errors don't abort test runs
          python3 -c '
          with open("project.godot", "r") as f:
              content = f.read()

          warnings_off = "gdscript/warnings/enable=false"
          if "[debug]" in content:
              content = content.replace("[debug]", "[debug]\n\n" + warnings_off)
          else:
              content += "\n\n[debug]\n\n" + warnings_off + "\n"

          with open("project.godot", "w") as f:
              f.write(content)
          '

          if [ -f "./addons/gdUnit4/bin/GdUnitCmdTool.gd" ]; then
            echo "✅ GDUnit4 successfully installed."
          else
            echo "❌ ERROR: Failed to install GDUnit4 (GdUnitCmdTool.gd not found)!"
            exit 1
          fi

      # The committed project.godot keeps gdUnit4-coverage enabled for local editor
      # use. CI deletes the addon, so strip its plugin entry, session hook, and
      # settings section from this run's copy of project.godot; otherwise gdUnit4
      # fails loading the missing hook. Nothing is committed back.
      # Logic and tests: .github/scripts/strip_gdunit4_coverage.py,
      # tests/ci/test_strip_gdunit4_coverage.py
      - name: "Strip gdUnit4-coverage From CI Project Config"
        run: |
          python3 .github/scripts/strip_gdunit4_coverage.py project.godot

      # Move tests outside the workspace so the project import below
      # doesn't compile the full test tree
      - name: "Isolate Test Suites Outside Workspace"
        run: |
          rm -rf /tmp/test_backup
          cp -r test /tmp/test_backup
          rm -rf test
          mkdir -p test
          echo "✅ Test suites stashed to /tmp/test_backup."

      # Initialize Godot project and generate .godot cache (class_name registry, imports)
      - name: "Initialize Project"
        run: |
          rm -rf .godot/
          ./godot --headless --editor --quit --path .

      # Run every gdUnit4 suite in a single pass
      - name: "Run GDUnit4 Test Suites"
        run: |
          cp -r /tmp/test_backup/gdunit4 test/gdunit4

          xvfb-run ./godot -d --path . -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode \
            -a res://test/gdunit4

      # Always restore the full test folder so report finders and
      # artifact uploaders have complete access
      - name: "Restore Full Test Suite"
        if: "always()"
        run: |
          if [ -d "/tmp/test_backup" ]; then
            rm -rf test
            cp -r /tmp/test_backup test
            echo "✅ Full test suite workspace restored from /tmp/test_backup."
          fi

      # Upload XML/HTML test reports generated by GDUnit4 as GitHub Actions run artifacts
      - name: "Upload Test Reports Artifacts"
        if: "always()"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # v7.0.1
        with:
          name: "gdunit-reports"
          path: |
            reports/**
            artifacts/gdunit-reports/**
          if-no-files-found: "ignore"
          retention-days: 5

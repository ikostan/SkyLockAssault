---
name: "GDUnit4 Unit Tests & Code Coverage"

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      godot_version:
        type: "string"
        default: "4.6.3-stable"
      godot_sha256:
        type: "string"
        default: "d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3"
    secrets:
      CODECOV_TOKEN:
        description: "Codecov requires a token to authenticate"
        required: true

jobs:
  unit-test:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      checks: "write"
    env:
      GODOT_VERSION: "${{ inputs.godot_version }}"
      GODOT_SHA256: "${{ inputs.godot_sha256 }}"
    steps:
      - uses: "actions/checkout@v7"
        with:
          persist-credentials: false

      - name: "Install System Dependencies (xvfb & lcov)"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb lcov

      - name: "Download and Verify Godot Binary"
        run: |
          URL="https://github.com/godotengine/godot/releases/download"
          ZIP_NAME="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          wget -q "${URL}/${GODOT_VERSION}/${ZIP_NAME}"

          echo "${GODOT_SHA256}  ${ZIP_NAME}" | sha256sum --check --status
          if [ $? -ne 0 ]; then
            echo "❌ CRITICAL: Godot binary verification failed! Checksum mismatch."
            exit 1
          fi

          unzip "${ZIP_NAME}"
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

      - name: "Install GDUnit4 (v6.2.0+) & GdUnit4 Coverage Plugin"
        run: |
          mkdir -p addons
          # Upgrade GDUnit4 to v6.2.0 required for coverage integration
          URL_GDUNIT="https://github.com/godot-gdunit-labs/gdUnit4/archive/refs/tags/v6.2.0.zip"
          wget "$URL_GDUNIT" -O gdunit4.zip
          unzip gdunit4.zip -d addons
          mv addons/gdUnit4-6.2.0/addons/gdUnit4 addons/gdUnit4
          rm -rf addons/gdUnit4-6.2.0 gdunit4.zip

          # Install gdunit4_coverage plugin & set gdcov permissions
          URL_COV="https://github.com/godot-gdunit-labs/gdUnit4-coverage/releases/latest/download/gdunit4_coverage.zip"
          wget "$URL_COV" -O coverage.zip || true
          if [ -f "coverage.zip" ]; then
            unzip coverage.zip -d addons
            rm coverage.zip
          fi
          
          chmod +x addons/gdunit4_coverage/bin/gdcov 2>/dev/null || true

      - name: "Initialize Project and UIDs"
        run: |
          ./godot --headless --editor --quit --path .

      - name: "Run Coverage - Batch 1 (Core Systems & Entities)"
        run: |
          xvfb-run ./godot --path . -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode \
            --add res://test/gdunit4/core/

          USER_PATH="$HOME/.local/share/godot/app_userdata/SkyLockAssault/coverage/coverage.lcov"
          if [ -f "$USER_PATH" ]; then
            cp "$USER_PATH" ./batch1.lcov
            echo "Batch 1 tracefile saved successfully."
          else
            echo "Warning: Batch 1 coverage tracefile missing at $USER_PATH"
          fi

      - name: "Run Coverage - Batch 2 (UI, Menus & Controls)"
        run: |
          xvfb-run ./godot --path . -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode \
            --add res://test/gdunit4/ui/

          USER_PATH="$HOME/.local/share/godot/app_userdata/SkyLockAssault/coverage/coverage.lcov"
          if [ -f "$USER_PATH" ]; then
            cp "$USER_PATH" ./batch2.lcov
            echo "Batch 2 tracefile saved successfully."
          else
            echo "Warning: Batch 2 coverage tracefile missing at $USER_PATH"
          fi

      - name: "Merge LCOV Tracefiles"
        run: |
          if [ -f "./batch1.lcov" ] && [ -f "./batch2.lcov" ]; then
            lcov -a batch1.lcov -a batch2.lcov -o final_coverage.lcov
            echo "=== Combined LCOV Coverage Report Summary ==="
            lcov --summary final_coverage.lcov
          elif [ -f "./batch1.lcov" ]; then
            cp ./batch1.lcov ./final_coverage.lcov
          elif [ -f "./batch2.lcov" ]; then
            cp ./batch2.lcov ./final_coverage.lcov
          else
            echo "No LCOV tracefiles were generated to merge."
          fi

      - name: "Find Latest Report Directory"
        id: "find_report"
        if: "always()"
        run: |
          LATEST_REPORT=$(ls -td reports/report_* artifacts/gdunit-reports/report_* 2>/dev/null | head -1 || echo "")
          if [ -z "$LATEST_REPORT" ]; then
            echo "No report directory found; tests may not have generated reports."
          fi
          echo "latest_report=$LATEST_REPORT" >> "$GITHUB_OUTPUT"

      - name: "Upload Test Reports Artifacts"
        if: "always()"
        uses: "actions/upload-artifact@v7"
        with:
          name: "gdunit-reports"
          path: |
            reports/**
            artifacts/gdunit-reports/**
            final_coverage.lcov
          if-no-files-found: "ignore"
          retention-days: 5

      - name: "Install Codecov CLI"
        if: "success()"
        run: |
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov

      - name: "Upload LCOV Coverage & Test Results to Codecov"
        if: "success()"
        run: |
          # Upload Merged Coverage Metrics
          if [ -f "./final_coverage.lcov" ]; then
            ./codecov upload-process \
              --token ${{ secrets.CODECOV_TOKEN }} \
              -f "./final_coverage.lcov" \
              --name "GDUnit4 Code Coverage" \
              --flag GDUnit4
          fi

          # Upload Test Result XML (if generated)
          REPORT_FILE="${{ steps.find_report.outputs.latest_report }}/test-report.xml"
          if [ -f "$REPORT_FILE" ]; then
            ./codecov upload-process \
              --token ${{ secrets.CODECOV_TOKEN }} \
              -f "$REPORT_FILE" \
              --name "GDUnit4 Test Report" \
              --flag GDUnit4 \
              --report-type test_results
          fi

---
name: "GDUnit4 Unit Tests & Code Coverage"

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      godot_version:
        type: "string"
        default: "4.6.3-stable"
      godot_sha256:
        type: "string"
        default: "d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3"
    secrets:
      CODECOV_TOKEN:
        description: "Codecov requires a token to authenticate"
        required: true

jobs:
  unit-test:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      checks: "write"
    env:
      GODOT_VERSION: "${{ inputs.godot_version }}"
      GODOT_SHA256: "${{ inputs.godot_sha256 }}"
    steps:
      - uses: "actions/checkout@v7"
        with:
          persist-credentials: false

      - name: "Install System Dependencies (xvfb & lcov)"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb lcov

      - name: "Download and Verify Godot Binary"
        run: |
          URL="https://github.com/godotengine/godot/releases/download"
          ZIP_NAME="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          wget -q "${URL}/${GODOT_VERSION}/${ZIP_NAME}"

          echo "${GODOT_SHA256}  ${ZIP_NAME}" | sha256sum --check --status
          if [ $? -ne 0 ]; then
            echo "❌ CRITICAL: Godot binary verification failed! Checksum mismatch."
            exit 1
          fi

          unzip "${ZIP_NAME}"
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

      - name: "Install GDUnit4 (v6.2.0+) & GdUnit4 Coverage Extension"
        run: |
          rm -rf addons/gdUnit4 addons/gdunit4_coverage temp_cov

          mkdir -p addons

          # 1. Install GDUnit4 Core (v6.2.0)
          URL_GDUNIT="https://github.com/godot-gdunit-labs/gdUnit4/archive/refs/tags/v6.2.0.zip"
          wget -q "$URL_GDUNIT" -O gdunit4.zip
          unzip -q gdunit4.zip -d addons
          mv addons/gdUnit4-6.2.0/addons/gdUnit4 addons/gdUnit4
          rm -rf addons/gdUnit4-6.2.0 gdunit4.zip

          # 2. Extract GdUnit4 Coverage v0.1.4 (GDExtension)
          URL_COV="https://github.com/godot-gdunit-labs/gdUnit4-coverage/releases/download/v0.1.4/gdUnit4-coverage-0.1.4-trial.zip"
          wget -q "$URL_COV" -O coverage.zip
          mkdir -p temp_cov
          unzip -q coverage.zip -d temp_cov/
          rm coverage.zip

          cp -r temp_cov/addons/gdunit4_coverage addons/
          rm -rf temp_cov

          # 3. Register gdunit4_coverage in project.godot so GDUnit4 installs the coverage hook
          python3 -c '
          with open("project.godot", "r") as f:
              content = f.read()
          if "res://addons/gdunit4_coverage/plugin.cfg" not in content:
              if "[editor_plugins]" in content:
                  content = content.replace("enabled=PackedStringArray(", "enabled=PackedStringArray(\"res://addons/gdunit4_coverage/plugin.cfg\", ")
              else:
                  content += "\n[editor_plugins]\n\nenabled=PackedStringArray(\"res://addons/gdunit4_coverage/plugin.cfg\")\n"
              with open("project.godot", "w") as f:
                  f.write(content)
              print("✅ Registered gdunit4_coverage plugin in project.godot")
          '

          # Verification
          if [ -f "./addons/gdunit4_coverage/gdunit4_coverage.gdextension" ]; then
            echo "✅ GDExtension successfully installed at ./addons/gdunit4_coverage/"
          else
            echo "❌ ERROR: Failed to install gdunit4_coverage GDExtension!"
            exit 1
          fi

      - name: "Initialize Project and Register GDExtensions"
        run: |
          # Purge stale engine cache so Godot registers res://addons/gdunit4_coverage/
          rm -rf .godot/
          ./godot --headless --editor --quit --path .

      - name: "Run Coverage - Batch 1 (Core Systems & Entities)"
        run: |
          xvfb-run ./godot --path . -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode \
            --add res://test/gdunit4/test_audio_manager.gd \
            --add res://test/gdunit4/test_bullet.gd \
            --add res://test/gdunit4/test_difficulty.gd \
            --add res://test/gdunit4/test_difficulty_integration.gd \
            --add res://test/gdunit4/test_globals.gd \
            --add res://test/gdunit4/test_helpers.gd \
            --add res://test/gdunit4/test_player.gd \
            --add res://test/gdunit4/test_settings.gd \
            --add res://test/gdunit4/test_settings_persistence.gd

          USER_PATH=$(find "$HOME/.local/share/godot/" "$PWD" -name "coverage.lcov" 2>/dev/null | head -n 1)

          if [ -n "$USER_PATH" ] && [ -f "$USER_PATH" ]; then
            cp "$USER_PATH" ./batch1.lcov
            rm -f "$USER_PATH"
            echo "✅ Batch 1 tracefile saved successfully ($(du -h ./batch1.lcov | cut -f1))."
          else
            echo "❌ ERROR: Batch 1 coverage tracefile missing!"
            LOG_FILE=$(find "$HOME/.local/share/godot/" -name "gdcov.log" 2>/dev/null | head -n 1)
            if [ -n "$LOG_FILE" ] && [ -f "$LOG_FILE" ]; then
              echo "=== GDExtension Diagnostic Log (gdcov.log) ==="
              cat "$LOG_FILE"
            fi
            exit 1
          fi

      - name: "Run Coverage - Batch 2 (UI, Menus & Controls)"
        run: |
          xvfb-run ./godot --path . -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode \
            --add res://test/gdunit4/test_audio_settings.gd \
            --add res://test/gdunit4/test_audio_unexpected_exit.gd \
            --add res://test/gdunit4/test_input_remap_button.gd \
            --add res://test/gdunit4/test_load_options_reentrancy.gd \
            --add res://test/gdunit4/test_main_menu.gd \
            --add res://test/gdunit4/test_menu_visibility.gd \
            --add res://test/gdunit4/test_options_teardown.gd \
            --add res://test/gdunit4/test_volume_slider.gd \
            --add res://test/gdunit4/test_weapon_firing_bullet.gd

          USER_PATH=$(find "$HOME/.local/share/godot/" "$PWD" -name "coverage.lcov" 2>/dev/null | head -n 1)

          if [ -n "$USER_PATH" ] && [ -f "$USER_PATH" ]; then
            cp "$USER_PATH" ./batch2.lcov
            rm -f "$USER_PATH"
            echo "✅ Batch 2 tracefile saved successfully ($(du -h ./batch2.lcov | cut -f1))."
          else
            echo "❌ ERROR: Batch 2 coverage tracefile missing!"
            LOG_FILE=$(find "$HOME/.local/share/godot/" -name "gdcov.log" 2>/dev/null | head -n 1)
            if [ -n "$LOG_FILE" ] && [ -f "$LOG_FILE" ]; then
              echo "=== GDExtension Diagnostic Log (gdcov.log) ==="
              cat "$LOG_FILE"
            fi
            exit 1
          fi

      - name: "Merge LCOV Tracefiles"
        run: |
          if [ -f "./batch1.lcov" ] && [ -f "./batch2.lcov" ]; then
            lcov -a batch1.lcov -a batch2.lcov -o final_coverage.lcov
            echo "=== Combined LCOV Coverage Report Summary ==="
            lcov --summary final_coverage.lcov
          elif [ -f "./batch1.lcov" ]; then
            cp ./batch1.lcov ./final_coverage.lcov
          elif [ -f "./batch2.lcov" ]; then
            cp ./batch2.lcov ./final_coverage.lcov
          else
            echo "❌ ERROR: No LCOV tracefiles were generated to merge."
            exit 1
          fi

      - name: "Find Latest Report Directory"
        id: "find_report"
        if: "always()"
        run: |
          LATEST_REPORT=$(ls -td reports/report_* artifacts/gdunit-reports/report_* 2>/dev/null | head -1 || echo "")
          if [ -z "$LATEST_REPORT" ]; then
            echo "No report directory found; tests may not have generated reports."
          fi
          echo "latest_report=$LATEST_REPORT" >> "$GITHUB_OUTPUT"

      - name: "Upload Test Reports Artifacts"
        if: "always()"
        uses: "actions/upload-artifact@v7"
        with:
          name: "gdunit-reports"
          path: |
            reports/**
            artifacts/gdunit-reports/**
            final_coverage.lcov
          if-no-files-found: "ignore"
          retention-days: 5

      - name: "Install Codecov CLI"
        if: "success()"
        run: |
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov

      - name: "Upload LCOV Coverage & Test Results to Codecov"
        if: "always()"
        run: |
          echo "=================================================="
          echo "         CODECOV UPLOAD DIAGNOSTICS               "
          echo "=================================================="

          if [ -f "./final_coverage.lcov" ]; then
            echo "✅ Found ./final_coverage.lcov ($(du -h ./final_coverage.lcov | cut -f1))"
            echo "🚀 Initiating Codecov coverage upload..."
            ./codecov --verbose upload-process \
              --token "${{ secrets.CODECOV_TOKEN }}" \
              -f "./final_coverage.lcov" \
              --name "GDUnit4 Code Coverage" \
              --flag GDUnit4
          else
            echo "❌ CRITICAL: ./final_coverage.lcov WAS NOT FOUND!"
          fi

          echo "--------------------------------------------------"

          REPORT_FILE="${{ steps.find_report.outputs.latest_report }}/test-report.xml"
          if [ -f "$REPORT_FILE" ]; then
            echo "✅ Found test report XML at: $REPORT_FILE"
            echo "🚀 Uploading test result XML to Codecov..."
            ./codecov --verbose upload-process \
              --token "${{ secrets.CODECOV_TOKEN }}" \
              -f "$REPORT_FILE" \
              --name "GDUnit4 Test Report" \
              --flag GDUnit4 \
              --report-type test_results
          else
            echo "⚠️ WARNING: Test report XML not found at '$REPORT_FILE'"
          fi

          echo "=================================================="

---
name: "GDUnit4 Unit Tests & Code Coverage"

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      godot_version:
        type: "string"
        default: "4.7.1-stable"
      godot_sha256:
        type: "string"
        default: ""
    secrets:
      CODECOV_TOKEN:
        description: "Codecov requires a token to authenticate"
        required: false

jobs:
  unit-test:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      checks: "write"
    env:
      GODOT_VERSION: "${{ inputs.godot_version }}"
      GODOT_SHA256: "${{ inputs.godot_sha256 }}"
    steps:
      - uses: "actions/checkout@v7"
        with:
          persist-credentials: false

      - name: "Install System Dependencies (xvfb & lcov)"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb lcov

      - name: "Download and Verify Godot Binary"
        run: |
          URL="https://github.com/godotengine/godot/releases/download"
          ZIP_NAME="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          wget -q "${URL}/${GODOT_VERSION}/${ZIP_NAME}"

          echo "=================================================="
          echo "         ASSET SHA256 CHECKSUM                    "
          echo "=================================================="
          CALCULATED_SHA256=$(sha256sum "${ZIP_NAME}" | awk '{print $1}')
          echo "SHA256 for ${ZIP_NAME}:"
          echo "${CALCULATED_SHA256}"
          echo "=================================================="

          if [ -n "${GODOT_SHA256}" ]; then
            echo "${GODOT_SHA256}  ${ZIP_NAME}" | sha256sum --check --status || {
              echo "❌ CRITICAL: Godot binary verification failed! Checksum mismatch."
              exit 1
            }
          fi

          unzip "${ZIP_NAME}"
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

      - name: "Verify Godot Engine Version Parity"
        run: |
          ENGINE_VERSION=$(./godot --version)
          echo "Detected engine version: $ENGINE_VERSION"
          echo "$ENGINE_VERSION" | grep -q "4.7.1.stable" || {
            echo "❌ ERROR: Expected Godot 4.7.1.stable, but received: $ENGINE_VERSION"
            exit 1
          }
          echo "✅ Version parity verified (4.7.1.stable)."

      - name: "Install GDUnit4 Core & Coverage GDExtension"
        run: |
          rm -rf addons/gdUnit4 addons/gdunit4_coverage temp_cov override.cfg
          mkdir -p addons

          # 1. Install GDUnit4 Core (v6.2.0)
          URL_GDUNIT="https://github.com/godot-gdunit-labs/gdUnit4/archive/refs/tags/v6.2.0.zip"
          wget -q "$URL_GDUNIT" -O gdunit4.zip
          unzip -q gdunit4.zip -d addons
          mv addons/gdUnit4-6.2.0/addons/gdUnit4 addons/gdUnit4
          rm -rf addons/gdUnit4-6.2.0 gdunit4.zip

          # 2. Extract GdUnit4 Coverage v0.1.4 (GDExtension)
          URL_COV="https://github.com/godot-gdunit-labs/gdUnit4-coverage/releases/download/v0.1.4/gdUnit4-coverage-0.1.4-trial.zip"
          wget -q "$URL_COV" -O coverage.zip
          mkdir -p temp_cov
          unzip -q coverage.zip -d temp_cov/
          rm coverage.zip

          cp -r temp_cov/addons/gdunit4_coverage addons/
          rm -rf temp_cov

          # 3. Enable plugin & suppress debug warnings safely
          python3 -c '
          with open("project.godot", "r") as f:
              content = f.read()

          if "res://addons/gdunit4_coverage/plugin.cfg" not in content:
              if "enabled=PackedStringArray(" in content:
                  content = content.replace("enabled=PackedStringArray(", "enabled=PackedStringArray(\"res://addons/gdunit4_coverage/plugin.cfg\", ")
              elif "[editor_plugins]" in content:
                  content = content.replace("[editor_plugins]", "[editor_plugins]\n\nenabled=PackedStringArray(\"res://addons/gdunit4_coverage/plugin.cfg\")")
              else:
                  content += "\n\n[editor_plugins]\n\nenabled=PackedStringArray(\"res://addons/gdunit4_coverage/plugin.cfg\")\n"

          if "[debug]" in content:
              content = content.replace("[debug]", "[debug]\n\ngdscript/warnings/enable=false")
          else:
              content += "\n\n[debug]\n\ngdscript/warnings/enable=false\n"

          with open("project.godot", "w") as f:
              f.write(content)
          '

          if [ -f "./addons/gdunit4_coverage/gdunit4_coverage.gdextension" ]; then
            echo "✅ GDExtension successfully installed."
          else
            echo "❌ ERROR: Failed to install gdunit4_coverage GDExtension!"
            exit 1
          fi

      - name: "Download and Setup gdcov Runner"
        run: |
          wget -q "https://github.com/godot-gdunit-labs/gdUnit4-coverage/releases/download/v0.1.4/manifest.json" -O manifest.json

          GDCOV_URL=$(python3 -c '
          import json
          with open("manifest.json") as f:
              m = json.load(f)

          gdcov = m.get("gdcov", {})
          url = ""

          for ver_key, platforms in gdcov.items():
              if "4.7" in ver_key:
                  linux_info = platforms.get("linux-x86_64") or platforms.get("linux", {})
                  if isinstance(linux_info, dict):
                      url = linux_info.get("url", "")
                      if url:
                          break

          print(url)
          ')

          if [ -z "$GDCOV_URL" ]; then
            echo "❌ Failed to resolve gdcov download URL from manifest.json"
            cat manifest.json
            exit 1
          fi

          wget -q "$GDCOV_URL" -O gdcov_linux.zip
          unzip -q gdcov_linux.zip
          RUNNER=$(find . -maxdepth 2 -type f -name "gdcov*" ! -name "*.zip" | head -n 1)
          mv "$RUNNER" ./gdcov
          chmod +x ./gdcov
          echo "✅ gdcov runner ready: $(./gdcov --version)"

      - name: "Isolate Test Suites Outside Workspace"
        run: |
          # 1. Back up all tests outside the Godot res:// root
          rm -rf /tmp/test_backup
          cp -r test /tmp/test_backup

          # 2. Clear res://test completely so Godot does not pre-compile test files on boot
          rm -rf test
          mkdir -p test/gdunit4

          # 3. Configure coverage filters in override.cfg
          cat << 'EOF' > override.cfg
          [gdunit4]
          coverage/include_paths=PackedStringArray("res://scripts")
          coverage/exclude_paths=PackedStringArray("res://test", "res://addons")

          [gdunit4_coverage]
          settings/include_filters=PackedStringArray("res://scripts")
          settings/exclude_filters=PackedStringArray("res://test", "res://addons")
          EOF

          echo "✅ Test suites stashed to /tmp/test_backup and override.cfg configured."

      - name: "Initialize Project and Register GDExtensions"
        run: |
          rm -rf .godot/
          ./godot --headless --editor --quit --path .

      - name: "Run GDUnit4 Coverage in Micro-Batches"
        run: |
          rm -rf lcov_batches
          mkdir -p lcov_batches

          # Collect only GDUnit test suites (ignore helpers/gut)
          TEST_FILES=($(find /tmp/test_backup/gdunit4 -name "test_*.gd" ! -name "test_helpers.gd" | sort))
          echo "Found ${#TEST_FILES[@]} test suites. Running in micro-batches of 2 files..."

          BATCH_NUM=1
          CHUNK_SIZE=2

          for ((i=0; i<${#TEST_FILES[@]}; i+=CHUNK_SIZE)); do
            CHUNK=("${TEST_FILES[@]:i:CHUNK_SIZE}")
            echo "--------------------------------------------------"
            echo "🚀 Running Micro-Batch $BATCH_NUM: ${CHUNK[*]}"
            echo "--------------------------------------------------"

            # Wipe res://test and stage ONLY the current 2 test files (+ helper if present)
            rm -rf test
            mkdir -p test/gdunit4

            if [ -f "/tmp/test_backup/gdunit4/test_helpers.gd" ]; then
              cp "/tmp/test_backup/gdunit4/test_helpers.gd" "test/gdunit4/"
            fi

            ADD_ARGS=()
            for t_file in "${CHUNK[@]}"; do
              BASE_NAME=$(basename "$t_file")
              cp "$t_file" "test/gdunit4/$BASE_NAME"
              ADD_ARGS+=(--add "res://test/gdunit4/$BASE_NAME")
            done

            # Clear previous runner coverage output before launching
            find "$HOME/.local/share/godot/" "$PWD" -name "coverage.lcov" -delete 2>/dev/null || true

            # Execute micro-batch (2 tests + production scripts <= 10 files total)
            xvfb-run ./gdcov -d --path . -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
              --ignoreHeadlessMode \
              "${ADD_ARGS[@]}"

            USER_PATH=$(find "$HOME/.local/share/godot/" "$PWD" -name "coverage.lcov" 2>/dev/null | head -n 1)
            if [ -n "$USER_PATH" ] && [ -f "$USER_PATH" ]; then
              cp "$USER_PATH" "lcov_batches/batch_${BATCH_NUM}.lcov"
              echo "✅ Captured tracefile: lcov_batches/batch_${BATCH_NUM}.lcov"
            else
              echo "⚠️ WARNING: No tracefile generated for Batch $BATCH_NUM"
            fi

            BATCH_NUM=$((BATCH_NUM + 1))
          done

      - name: "Restore Full Test Suite & Merge LCOV Tracefiles"
        run: |
          # 1. Restore complete test folder for artifact uploaders and report parsers
          rm -rf test
          cp -r /tmp/test_backup test

          # 2. Build lcov merge arguments from all generated micro-batches
          LCOV_ARGS=()
          for f in lcov_batches/*.lcov; do
            if [ -f "$f" ]; then
              LCOV_ARGS+=(-a "$f")
            fi
          done

          if [ ${#LCOV_ARGS[@]} -gt 0 ]; then
            lcov "${LCOV_ARGS[@]}" -o final_coverage.lcov
          else
            echo "❌ ERROR: No batch LCOV tracefiles were captured."
            exit 1
          fi

          # 3. Strip absolute CI runner directory prefix and res:// prefix
          sed -i 's|SF:.*/SkyLockAssault/|SF:|g' final_coverage.lcov
          sed -i 's|SF:res://|SF:|g' final_coverage.lcov

          # 4. Clean up micro-batch directory
          rm -rf lcov_batches

          echo "=================================================="
          echo "=== Tracked Files in final_coverage.lcov ==="
          grep '^SF:' final_coverage.lcov | sort -u
          echo "=================================================="

          echo "=== Final Sanitized LCOV Summary ==="
          lcov --summary final_coverage.lcov

      - name: "Find Latest Report Directory"
        id: "find_report"
        if: "always()"
        run: |
          LATEST_REPORT=$(ls -td reports/report_* artifacts/gdunit-reports/report_* 2>/dev/null | head -1 || echo "")
          echo "latest_report=$LATEST_REPORT" >> "$GITHUB_OUTPUT"

      - name: "Upload Test Reports Artifacts"
        if: "always()"
        uses: "actions/upload-artifact@v7"
        with:
          name: "gdunit-reports"
          path: |
            reports/**
            artifacts/gdunit-reports/**
            final_coverage.lcov
          if-no-files-found: "ignore"
          retention-days: 5

      - name: "Install Codecov CLI"
        if: "success()"
        run: |
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov

      - name: "Upload LCOV Coverage & Test Results to Codecov"
        if: "success()"
        run: |
          echo "=================================================="
          echo "         CODECOV UPLOAD DIAGNOSTICS               "
          echo "=================================================="

          if [ -f "./final_coverage.lcov" ]; then
            echo "✅ Found ./final_coverage.lcov ($(du -h ./final_coverage.lcov | cut -f1))"
            echo "🚀 Initiating Codecov coverage upload..."
            ./codecov --verbose upload-process \
              --token "${{ secrets.CODECOV_TOKEN }}" \
              -f "./final_coverage.lcov" \
              --disable-search \
              --name "GDUnit4 Code Coverage" \
              --flag GDUnit4
          else
            echo "❌ CRITICAL: ./final_coverage.lcov WAS NOT FOUND!"
          fi

          echo "--------------------------------------------------"

          REPORT_DIR="${{ steps.find_report.outputs.latest_report }}"
          REPORT_FILE=""
          if [ -f "$REPORT_DIR/results.xml" ]; then
            REPORT_FILE="$REPORT_DIR/results.xml"
          elif [ -f "$REPORT_DIR/test-report.xml" ]; then
            REPORT_FILE="$REPORT_DIR/test-report.xml"
          fi

          if [ -n "$REPORT_FILE" ]; then
            echo "✅ Found test report XML at: $REPORT_FILE"
            echo "🚀 Uploading test result XML to Codecov..."
            ./codecov --verbose upload-process \
              --token "${{ secrets.CODECOV_TOKEN }}" \
              -f "$REPORT_FILE" \
              --disable-search \
              --name "GDUnit4 Test Report" \
              --flag GDUnit4 \
              --report-type test_results
          else
            echo "⚠️ WARNING: Test report XML not found in '$REPORT_DIR'"
          fi

          echo "=================================================="

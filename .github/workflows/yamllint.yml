---
name: "Yamllint"

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      config-path:
        description: "A folder name to run tests on"
        required: true
        type: "string"

permissions:
  contents: "read"
  pull-requests: "read"

jobs:
  build:
    runs-on: "ubuntu-24.04"
    # Adding 'timeout-minutes: 10' would prevent jobs from running
    # indefinitely if something goes wrong
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.x"]
    steps:
      - uses: "actions/checkout@v7.0.1"
      - name: "Cache PIP Dependencies"
        uses: "actions/cache@v6"
        with:
          path: "~/.cache/pip"
          key: "${{ runner.os }}-pip-yamllint"
          restore-keys: |
            ${{ runner.os }}-pip-
        # yamllint disable rule:line-length
      - name: Set up Python ${{ matrix.python-version }}  # yamllint disable-line rule:quoted-strings
        # yamllint enable rule:line-length
        uses: "actions/setup-python@v7.0.0"
        with:
          python-version: "${{ matrix.python-version }}"
      # You can test your matrix by printing the current Python version
      - name: "Display Python Version"
        run: |
          python -c "import sys; print(sys.version)"
      - name: "Install Yamllint"
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade yamllint
      - name: "Version Check"
        run: |
          python -m yamllint --version

      - name: "Analysing YML Files"
        run: |
          python -m yamllint -c .yamllint.yaml ${{ inputs.config-path }}

      # Ref #1008: checks how workflows call each other (input and secret
      # names, required inputs/secrets, expressions). These mistakes are valid
      # YAML but stop GitHub from starting the workflow, and test_suite.yml
      # only runs on main. Shell and Python checks are off; this checks wiring.
      - name: "Install actionlint"
        timeout-minutes: 3
        env:
          ACTIONLINT_VERSION: "1.7.7"
          # yamllint disable-line rule:line-length
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          TAR="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          URL="https://github.com/rhysd/actionlint/releases/download"
          wget -q --tries=3 --timeout=30 "${URL}/v${ACTIONLINT_VERSION}/${TAR}"
          echo "${ACTIONLINT_SHA256}  ${TAR}" | sha256sum --check --status || {
            echo "❌ CRITICAL: actionlint checksum mismatch."
            exit 1
          }
          tar xzf "${TAR}" actionlint

      - name: "Check Workflow Wiring (actionlint)"
        run: |
          ./actionlint -color -shellcheck= -pyflakes=

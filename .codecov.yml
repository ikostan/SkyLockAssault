coverage:
  status:
    project:
      gdscript:
        target: 70%
        paths:
          - scripts/
        flags:
          - gdscript
      javascript:
        target: 50%
        paths:
          - export/web/
        flags:
          - playwright
    patch:
      default:
        target: 80%
  precision: 2
  range: "60...90"
  round: down

comment:
  layout: "diff, files"

ignore:
  - "export/web/*.wasm"
  - "export/web/*.pck"
  - "export/web/*.zip"

flags:
  gdscript:
    paths:
      - scripts/
  playwright:
    paths:
      - export/web/

fixes:
  - "::export/web/"
  - "anonymous_::export/web/index.js"
  - "/home/runner/work/SkyLockAssault/SkyLockAssault/::"

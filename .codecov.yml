coverage:
  status:
    project:
      gdscript:
        target: 70%
        flags:
          - gdunit4
        paths:
          - "scripts/"
      playwright:
        target: 50%
        flags:
          - playwright
        paths:
          - "export/web_thread_off/"
    patch:
      default:
        target: 80%
  precision: 2
  range: "60...90"
  round: down

comment:
  layout: "diff, files"

ignore:
  - "test/**/*"
  - "tests/**/*"
  - "addons/**/*"

flags:
  gdunit4:
    paths:
      - "scripts/"
    carryforward: false
  playwright:
    paths:
      - "export/web_thread_off/"
    carryforward: false

fixes:
  - "/home/runner/work/SkyLockAssault/SkyLockAssault/::"
  